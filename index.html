<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#124f43"/><title>HabitFlow — Build better days</title><link rel="stylesheet" href="styles.css"/></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="#dashboard"><span class="brand-icon">✦</span>HabitFlow</a><div class="workspace"><span class="workspace-dot"></span><span>Personal space</span><span class="chevron">⌄</span></div><p class="nav-label">WORKSPACE</p><nav id="main-nav"><button class="nav-item active" data-view="dashboard"><span>⌂</span>Dashboard</button><button class="nav-item" data-view="habits"><span>✓</span>My habits</button><button class="nav-item" data-view="insights"><span>◔</span>Insights</button><button class="nav-item" data-view="calendar"><span>□</span>Calendar</button></nav><div class="sidebar-bottom"><button class="nav-item" data-view="settings"><span>⚙</span>Settings</button><div class="profile"><div class="avatar">LA</div><div><b>Lalit A.</b><small>Building better days</small></div><span>•••</span></div></div></aside><main id="app"></main></div><dialog id="habit-dialog"><form id="habit-form"><button type="button" class="close" data-close-dialog>×</button><span class="modal-icon">✦</span><h2 id="modal-title">Start a new habit</h2><p>Small, repeatable actions make an extraordinary difference.</p><label>Habit name<input id="habit-name" required maxlength="42" placeholder="e.g. Journal for 10 minutes"/></label><div class="form-row"><label>Goal<input id="habit-goal" required maxlength="24" value="10 minutes"/></label><label>Category<select id="habit-category"><option>Mindfulness</option><option>Health</option><option>Learning</option><option>Fitness</option><option>Productivity</option></select></label></div><label>Reminder time<input id="habit-time" type="time" value="20:00"/></label><button class="button full" type="submit">Save habit</button></form></dialog><dialog id="confirm-dialog"><form method="dialog"><span class="modal-icon">⚠</span><h2>Delete this habit?</h2><p>This action removes it from your tracker. Your completion history will remain in your local data.</p><div class="dialog-actions"><button class="secondary" value="cancel">Keep it</button><button class="danger" id="confirm-delete" value="default">Delete habit</button></div></form></dialog><script src="app.js"></script></body></html>
